server {
  listen       80;
  listen  [::]:80;
  server_name  localhost;

  #access_log  /var/log/nginx/host.access.log  main;

  #location / {
  #    root   /usr/share/nginx/html;
  #    index  index.html index.htm;
  #}
  location / {
          return 200 "<title>Welcome to F-Stack Nginx!</title>\r\n pad data:0123456789012345678901234567890123456789012345678    901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567    890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456    789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345    678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789";
  }
  # Simulate download files of various sizes
  location /1kb { alias /mnt/ramdisk/1kb.txt; }
  location /4kb { alias /mnt/ramdisk/4kb.txt; }
  location /800b { alias /mnt/ramdisk/800b.txt; }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
      root   /usr/share/nginx/html;
  }

}
