# root account is necessary.
user  root;
# should be equal to the lcore count of `dpdk.lcore_mask` in f-stack.conf.
worker_processes  6;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

# path of f-stack configuration file, default: $NGX_PREFIX/conf/f-stack.conf.
fstack_conf f-stack.conf;

events {
    worker_connections  102400;
    use kqueue;
    # opt-proxy
    multi_accept on;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;


    # opt-proxy
    #sendfile        off;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    # -opt-proxy

    #keepalive_timeout  0;

    # opt-proxy
    # keepalive_timeout  65;
    keepalive_timeout  15;
    types_hash_max_size 2048;
    # -opt-proxy

    # opt-proxy
    # 启用缓存最小化
    proxy_buffering off;
    # 启用连接复用
    keepalive_requests 1000;
    # -opt-proxy
    #gzip  on;


    upstream backend_service {
        server 10.2.1.106:80;
        server 10.2.1.116:80;
    }

    server {
        listen       80;
        server_name  localhost;

        # bulid server on kernel network stack 
        # 
        #kernel_network_stack on;

        #charset koi8-r;

        access_log /dev/null;
        #access_log  logs/host.access.log  main;


        location / {
    # opt-proxy
            # proxy_set_header Host $host:$server_port;
            # proxy_set_header Referer $scheme://$host:$server_port;
    # -opt-proxy
            proxy_pass http://backend_service/;

    # opt-proxy
	    proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 降低延迟相关设置
            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
    # -opt-proxy
        }

